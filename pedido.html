<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Acompanhar pedido | Toledo Distribuidora de Papéis</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');
    :root { --vermelho: #e01e3c; --azul: #1a2f52; --suave: #6b7686; --linha: #dde3ec; --verde: #157a3c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #28303e; background: #f4f6fa; line-height: 1.5; }
    header { background: #fff; border-bottom: 1px solid var(--linha); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    header img { height: 46px; }
    header a { color: var(--azul); font-weight: 600; text-decoration: none; }
    main { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    h1 { font-family: 'Montserrat', sans-serif; color: var(--azul); font-size: 1.4rem; margin: 0 0 4px; }
    .sub { color: var(--suave); margin: 0 0 18px; }
    .cartao { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 18px; }
    label { display: block; font-weight: 600; color: var(--azul); margin: 10px 0 4px; font-size: .92rem; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #c9d2df; border-radius: 8px; font: inherit; }
    button { margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--azul); color: #fff; font: 700 1rem 'Montserrat', sans-serif; cursor: pointer; }
    .erro { color: var(--vermelho); min-height: 1.2em; margin: 8px 0 0; }
    .etapas { list-style: none; padding: 0; margin: 18px 0 0; }
    .etapas li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; color: var(--suave); }
    .etapas li b { color: inherit; }
    .etapas li .bol { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid #c9d2df; display: grid; place-items: center; font-size: .75rem; }
    .etapas li.feito { color: #28303e; }
    .etapas li.feito .bol { background: var(--verde); border-color: var(--verde); color: #fff; }
    .pix { margin-top: 16px; background: #e9f9ef; border: 1px solid #bfe9cf; border-radius: 10px; padding: 14px; }
    .pix .chave { font: 700 1.15rem 'Montserrat', sans-serif; color: var(--verde); }
    .pix button { background: var(--verde); }
    .espera { margin-top: 16px; background: #fff8e8; border: 1px solid #f0dfa8; border-radius: 10px; padding: 12px 14px; color: #6b5200; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="logo-toledo.png" alt="Toledo Distribuidora de Papéis"></a>
    <a href="index.html">Voltar à loja</a>
  </header>
  <main>
    <h1>Acompanhar pedido</h1>
    <p class="sub">Informe o número do pedido do site e o WhatsApp usado na compra.</p>
    <div class="cartao">
      <form id="f">
        <label for="n">Número do pedido</label>
        <input id="n" placeholder="Ex.: S261109-1430-ABC" autocomplete="off" required>
        <label for="fone">WhatsApp</label>
        <input id="fone" inputmode="tel" placeholder="(31) 9 9999-9999" required>
        <button type="submit">Ver situação</button>
        <p class="erro" id="erro"></p>
      </form>
      <div id="res"></div>
    </div>
  </main>
  <script>
    /* Mesmo endereco do PEDIDOS_ENDPOINT do index.html (App da Web do Google). */
    var PEDIDOS_ENDPOINT = '';
    var $ = function (id) { return document.getElementById(id); };
    var dig = function (v) { return String(v || '').replace(/\D/g, ''); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    var moeda = function (v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('n')) $('n').value = q.get('n');
      var d = JSON.parse(localStorage.getItem('carrinho-dados') || '{}') || {};
      if (d.fone) $('fone').value = d.fone;
    } catch (e) {}

    function consultar() {
      var n = $('n').value.trim().toUpperCase(), f = dig($('fone').value);
      $('erro').textContent = '';
      if (!/^S\d{6}-\d{4}-[A-Z0-9]{3}$/.test(n)) { $('erro').textContent = 'Confira o número do pedido (começa com S).'; return; }
      if (f.length < 10) { $('erro').textContent = 'Digite o WhatsApp com DDD.'; return; }
      if (!PEDIDOS_ENDPOINT) { $('erro').textContent = 'Acompanhamento ainda não disponível. Fale com a loja no WhatsApp (31) 9 8511-3106.'; return; }
      $('res').innerHTML = '<p class="sub">Consultando…</p>';
      fetch(PEDIDOS_ENDPOINT + '?acao=status&numero=' + encodeURIComponent(n) + '&fone=' + encodeURIComponent(f))
        .then(function (r) { return r.json(); })
        .then(mostrar)
        .catch(function () { $('res').innerHTML = ''; $('erro').textContent = 'Não foi possível consultar agora. Tente de novo em instantes.'; });
    }
    function mostrar(r) {
      if (!r.ok) { $('res').innerHTML = ''; $('erro').textContent = 'Pedido não encontrado. Confira o número e o WhatsApp.'; return; }
      var ord = { recebido: 1, no_sankhya: 2, conferido: 3 }[r.status] || 1;
      var et = [['Pedido recebido pelo site', ''],
                ['Pedido lançado no nosso sistema', r.nunota ? 'nº ' + r.nunota : ''],
                ['Pedido separado e conferido', '']];
      var h = '<ul class="etapas">' + et.map(function (e, i) {
        return '<li class="' + (i < ord ? 'feito' : '') + '"><span class="bol">' + (i < ord ? '✓' : '') + '</span><span><b>' + e[0] + '</b>'
          + (e[1] ? ' · ' + esc(e[1]) : '') + '</span></li>';
      }).join('') + '</ul>';
      if (r.pix) {
        h += '<div class="pix"><b>Pedido conferido. Pode pagar pelo PIX.</b><br>Valor: <b>' + moeda(r.total) + '</b><br>Chave PIX (CNPJ):'
          + '<div class="chave">' + esc(r.pix.chave) + '</div>' + esc(r.pix.titular)
          + '<button type="button" id="copiar">Copiar chave PIX</button></div>';
      } else if (r.pagto === 'PIX') {
        h += '<div class="espera">A chave PIX aparece aqui <b>depois que o pedido for conferido</b>. Não pague antes disso.</div>';
      }
      $('res').innerHTML = h;
      var b = $('copiar');
      if (b) b.onclick = function () {
        var t = dig(r.pix.chave);
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { b.textContent = 'Chave copiada!'; },
          function () { b.textContent = r.pix.chave; });
      };
    }
    $('f').addEventListener('submit', function (ev) { ev.preventDefault(); consultar(); });
    if ($('n').value && dig($('fone').value).length >= 10) consultar();
  </script>
</body>
</html>
