<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Toledo Distribuidora — Site em manutenção</title>
<style>
  :root {
    --vermelho: #B3122E;
    --azul: #1E3A5F;
    --texto: #2b2b2b;
    --cinza: #6b6b6b;
    --borda: #e3e3e3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #fff;
    color: var(--texto);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cartao {
    width: 100%;
    max-width: 460px;
    text-align: center;
    border: 1px solid var(--borda);
    border-radius: 11px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    padding: 40px 28px 32px;
  }
  .logo { max-width: 230px; width: 70%; height: auto; margin-bottom: 26px; }
  h1 {
    font-size: 20px;
    line-height: 1.3;
    color: var(--azul);
    margin: 0 0 14px;
    letter-spacing: .2px;
  }
  .faixa {
    height: 3px;
    width: 54px;
    background: var(--vermelho);
    margin: 0 auto 20px;
    border-radius: 2px;
  }
  p { font-size: 15px; line-height: 1.55; color: var(--cinza); margin: 0 0 10px; }
  .zap {
    display: inline-block;
    margin-top: 22px;
    padding: 13px 26px;
    background: var(--vermelho);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
  }
  .zap:hover { background: #8f0e25; }
  .numero {
    margin-top: 12px;
    font-size: 14px;
    color: var(--cinza);
    font-variant-numeric: tabular-nums;
  }
  .rodape {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--borda);
    font-size: 12.5px;
    color: #9a9a9a;
  }
</style>
</head>
<body>
  <main class="cartao">
    <img class="logo" src="logo-toledo.png" alt="Toledo Distribuidora">
    <h1>Estamos em manutenção</h1>
    <div class="faixa"></div>
    <p>Nosso catálogo está passando por uma atualização e volta ao ar em breve.</p>
    <p>Enquanto isso, fale com a gente pelo WhatsApp — atendemos normalmente.</p>
    <a class="zap" href="https://wa.me/5531985113106?text=Ol%C3%A1%21%20Gostaria%20de%20fazer%20um%20or%C3%A7amento."
       target="_blank" rel="noopener">Falar no WhatsApp</a>
    <div class="numero">(31) 98511-3106</div>
    <div class="rodape">Toledo Distribuidora de Papéis</div>
  </main>
</body>
</html>
