      try { localStorage.setItem('toledo_regras', s); } catch (e) {}
      mostrar(h);
    }, function () { document.getElementById('erro').textContent = 'Senha incorreta.'; });
  });
  try { var g = localStorage.getItem('toledo_regras'); if (g) abrir(g).then(mostrar, function () {}); } catch (e) {}
</script>
</body>
</html>
