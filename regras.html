      .then(function (k) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bin(SAL), iterations: VOLTAS, hash: 'SHA-256' },
                                                       k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (c) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin(IV) }, c, bin(DADO)); })
      .then(function (t) { return new TextDecoder().decode(t); });
  }
  function mostrar(html) {
    document.getElementById('trava').hidden = true;
    var r = document.getElementById('regras'); r.innerHTML = html; r.hidden = false;
    document.title = 'Regras do Site Toledo';
  }
  document.getElementById('trava').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var s = document.getElementById('senha').value;
    document.getElementById('erro').textContent = 'Abrindo…';
    abrir(s).then(function (h) {
      try { localStorage.setItem('toledo_regras', s); } catch (e) {}
      mostrar(h);
    }, function () { document.getElementById('erro').textContent = 'Senha incorreta.'; });
  });
  try { var g = localStorage.getItem('toledo_regras'); if (g) abrir(g).then(mostrar, function () {}); } catch (e) {}
</script>
</body>
